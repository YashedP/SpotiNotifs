# Opt-in server deployment overlay.
x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://home-otel-collector:4318
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.version=${SERVICE_VERSION:?Set SERVICE_VERSION to the deployed commit}
  OTEL_TRACES_SAMPLER: parentbased_always_on
services:
  server:
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: spotinotifs-server
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [default, dokploy]
  notifier:
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: spotinotifs-notifier
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [default, dokploy]
networks:
  default: {}
  dokploy:
    external: true
    name: dokploy-network
